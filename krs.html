<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Matakuliah - Portal Administrasi Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar" id="topbar"></div>
      <div class="content">

        <!-- Overview -->
        <h2 class="section-title first">Overview</h2>
        <div class="stat-grid cols-2">
          <div class="stat-card">
            <div class="chip blue"><i class="fas fa-clipboard-list"></i></div>
            <div class="stat-label">Total SKS Diambil</div>
            <div class="stat-value"><span id="totalSKS">0</span> <span style="font-size:18px;color:var(--muted-soft);">/ 24</span></div>
          </div>
          <div class="stat-card">
            <div class="chip amber"><i class="fas fa-circle-check"></i></div>
            <div class="stat-label">Status KRS</div>
            <div style="margin-top:14px;"><span id="krsStatus" class="badge draft">Draft</span></div>
          </div>
        </div>

        <!-- Mata kuliah diambil -->
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <h2 class="section-title">Mata Kuliah Diambil</h2>
          <button class="btn btn-sm" onclick="approveKRSHandler()"><i class="fas fa-check-double"></i> Ajukan Persetujuan KRS</button>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>No</th><th>Kode</th><th>Mata Kuliah</th><th>SKS</th><th>Hari</th><th>Jam</th><th>Ruang</th><th>Dosen</th><th>Aksi</th></tr>
              </thead>
              <tbody id="myKRSBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Mata kuliah tersedia -->
        <h2 class="section-title">Mata Kuliah Tersedia</h2>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>No</th><th>Kode</th><th>Mata Kuliah</th><th>SKS</th><th>Hari</th><th>Jam</th><th>Ruang</th><th>Dosen</th><th>Aksi</th></tr>
              </thead>
              <tbody id="availableBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const user = checkSession();
    if (user) {
      buildShell({ active: 'krs', title: 'Registrasi Mata Kuliah' });
      loadKRSData();
    }

    function loadKRSData() {
      document.getElementById('totalSKS').textContent = getTotalSKS();

      const status = getKRSStatus();
      const statusEl = document.getElementById('krsStatus');
      statusEl.textContent = status;
      statusEl.className = 'badge ' + (status === 'Disetujui' ? 'approved' : 'draft');

      const myKRS = getKRS();
      const myKRSBody = document.getElementById('myKRSBody');
      if (myKRS.length === 0) {
        myKRSBody.innerHTML = '<tr><td colspan="9" class="text-center" style="color:var(--muted)">Belum ada mata kuliah yang diambil</td></tr>';
      } else {
        myKRSBody.innerHTML = myKRS.map((c, i) => `
          <tr>
            <td class="text-center">${i + 1}</td>
            <td>${c.code}</td><td>${c.name}</td>
            <td class="text-center">${c.sks}</td>
            <td>${c.day}</td><td>${c.time}</td><td>${c.room}</td><td>${c.lecturer}</td>
            <td class="text-center"><button class="btn btn-sm btn-danger" onclick="dropCourseHandler('${c.code}')"><i class="fas fa-xmark"></i> Batal</button></td>
          </tr>`).join('');
      }

      const myCodes = JSON.parse(localStorage.getItem('my_krs') || '[]');
      const available = getAvailableCourses().filter(c => !myCodes.includes(c.code));
      const availableBody = document.getElementById('availableBody');
      if (available.length === 0) {
        availableBody.innerHTML = '<tr><td colspan="9" class="text-center" style="color:var(--muted)">Tidak ada mata kuliah tersedia</td></tr>';
      } else {
        availableBody.innerHTML = available.map((c, i) => `
          <tr>
            <td class="text-center">${i + 1}</td>
            <td>${c.code}</td><td>${c.name}</td>
            <td class="text-center">${c.sks}</td>
            <td>${c.day}</td><td>${c.time}</td><td>${c.room}</td><td>${c.lecturer}</td>
            <td class="text-center"><button class="btn btn-sm btn-ghost" onclick="addCourseHandler('${c.code}')"><i class="fas fa-plus"></i> Ambil</button></td>
          </tr>`).join('');
      }
    }

    function addCourseHandler(code) {
      const r = addCourse(code);
      alert(r.message);
      if (r.success) loadKRSData();
    }
    function dropCourseHandler(code) {
      if (confirm('Yakin ingin membatalkan mata kuliah ini?')) {
        const r = dropCourse(code);
        alert(r.message);
        if (r.success) loadKRSData();
      }
    }
    function approveKRSHandler() {
      if (getKRS().length === 0) { alert('Anda belum mengambil mata kuliah apapun!'); return; }
      if (confirm('Ajukan KRS untuk persetujuan?')) {
        approveKRS();
        alert('KRS berhasil diajukan untuk persetujuan!');
        loadKRSData();
      }
    }
  </script>
</body>
</html>
