<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Matakuliah - Portal Administratif Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/krs.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Content Area -->
  <main class="content-area">
    <div class="krs-header-wrapper">
      <h2 class="dashboard-title">Kartu Rencana Studi (KRS)</h2>
      
      <div class="krs-status-badge-box">
        <div class="status-item">
          <span class="status-label">Beban SKS</span>
          <span class="status-value-text"><strong id="totalSKS">0</strong> / 24 SKS</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <span class="status-label">Status Verifikasi</span>
          <span id="krsStatus" class="status-badge-modern draft">Draft</span>
        </div>
      </div>
    </div>

    <div class="table-card">
      <h3 class="table-card-title"><i class="fas fa-folder-minus" style="color: var(--color-blue-primary);"></i> Mata Kuliah yang Sudah Diambil</h3>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th width="5%" class="text-center">No</th>
              <th width="15%">Kode MK</th>
              <th>Nama Mata Kuliah</th>
              <th width="10%" class="text-center">SKS</th>
              <th>Jadwal Pelaksanaan</th>
              <th>Ruang & Dosen</th>
              <th width="15%" class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="myKRSBody">
            <!-- Will be dynamically loaded -->
          </tbody>
        </table>
      </div>
      
      <div class="krs-action-container">
        <button class="btn-submit-krs" onclick="approveKRSHandler()">
          <i class="fas fa-paper-plane"></i> Ajukan Persetujuan KRS
        </button>
      </div>
    </div>

    <div class="table-card">
      <h3 class="table-card-title"><i class="fas fa-plus-circle"></i> Daftar Mata Kuliah Tersedia</h3>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th width="5%" class="text-center">No</th>
              <th width="15%">Kode MK</th>
              <th>Nama Mata Kuliah</th>
              <th width="10%" class="text-center">SKS</th>
              <th>Jadwal Pelaksanaan</th>
              <th>Ruang & Dosen</th>
              <th width="15%" class="text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="availableBody">
            <!-- Will be dynamically loaded -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    checkSession();
    // Load KRS data
    const user = getCurrentUser();
    if (user) {
      loadKRSData();
    }
    
    function loadKRSData() {
      // Update stats
      document.getElementById('totalSKS').textContent = getTotalSKS();
      
      const status = getKRSStatus();
      const statusEl = document.getElementById('krsStatus');
      statusEl.textContent = status;
      statusEl.className = 'status-badge-modern ' + (status === 'Disetujui' ? 'status-approved' : 'draft');
      
      // Load my KRS
      const myKRS = getKRS();
      const myKRSBody = document.getElementById('myKRSBody');
      
      if (myKRS.length === 0) {
        myKRSBody.innerHTML = '<tr><td colspan="7" class="text-center">Belum ada mata kuliah yang diambil</td></tr>';
      } else {
        myKRSBody.innerHTML = '';
        myKRS.forEach((course, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="text-center">${index + 1}</td>
            <td><strong>${course.code}</strong></td>
            <td>${course.name}</td>
            <td class="text-center font-semibold">${course.sks}</td>
            <td><strong>${course.day}</strong><br><small style="color: #64748B;">${course.time}</small></td>
            <td><i class="fas fa-door-open"></i> ${course.room}<br><small style="color: #64748B;"><i class="fas fa-user-tie"></i> ${course.lecturer}</small></td>
            <td class="text-center">
              <button class="btn-action-drop" onclick="dropCourseHandler('${course.code}')">
                <i class="fas fa-trash-alt"></i> Batal
              </button>
            </td>
          `;
          myKRSBody.appendChild(row);
        });
      }
      
      // Load available courses
      const availableCourses = getAvailableCourses();
      const myKRSCodes = getKRS().map(c => c.code);
      const availableBody = document.getElementById('availableBody');
      
      availableBody.innerHTML = '';
      let availableCount = 0;
      availableCourses.forEach((course) => {
        if (!myKRSCodes.includes(course.code)) {
          availableCount++;
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="text-center">${availableCount}</td>
            <td><strong>${course.code}</strong></td>
            <td>${course.name}</td>
            <td class="text-center font-semibold">${course.sks}</td>
            <td><strong>${course.day}</strong><br><small style="color: #64748B;">${course.time}</small></td>
            <td><i class="fas fa-door-open"></i> ${course.room}<br><small style="color: #64748B;"><i class="fas fa-user-tie"></i> ${course.lecturer}</small></td>
            <td class="text-center">
              <button class="btn-action-add" onclick="addCourseHandler('${course.code}')">
                <i class="fas fa-plus"></i> Ambil
              </button>
            </td>
          `;
          availableBody.appendChild(row);
        }
      });
      
      if (availableCount === 0) {
        availableBody.innerHTML = '<tr><td colspan="7" class="text-center">Tidak ada mata kuliah tersedia</td></tr>';
      }
    }
    
    function addCourseHandler(courseCode) {
      const result = addCourse(courseCode);
      if (result.success) {
        alert(result.message);
        loadKRSData();
      } else {
        alert(result.message);
      }
    }
    
    function dropCourseHandler(courseCode) {
      if (confirm('Yakin ingin membatalkan mata kuliah ini?')) {
        const result = dropCourse(courseCode);
        if (result.success) {
          alert(result.message);
          loadKRSData();
        } else {
          alert(result.message);
        }
      }
    }
    
    function approveKRSHandler() {
      const myKRS = getKRS();
      if (myKRS.length === 0) {
        alert('Anda belum mengambil mata kuliah apapun!');
        return;
      }
      
      if (confirm('Ajukan KRS untuk persetujuan?')) {
        approveKRS();
        alert('KRS berhasil diajukan untuk persetujuan!');
        loadKRSData();
      }
    }
  </script>
</body>
</html>
