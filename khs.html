<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Studi - Portal Administrasi Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar" id="topbar"></div>
      <div class="content">

        <!-- Ringkasan -->
        <h2 class="section-title first">Ringkasan Studi</h2>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="chip amber"><i class="fas fa-star"></i></div>
            <div class="stat-label">IPK Kumulatif</div>
            <div class="stat-value" id="gpaValue">0.00</div>
            <div class="stat-sub">skala 4.00</div>
          </div>
          <div class="stat-card">
            <div class="chip green"><i class="fas fa-layer-group"></i></div>
            <div class="stat-label">Total SKS Lulus</div>
            <div class="stat-value" id="totalCredits">0</div>
            <div class="stat-sub">target 144 SKS</div>
          </div>
          <div class="stat-card">
            <div class="chip blue"><i class="fas fa-book"></i></div>
            <div class="stat-label">Mata Kuliah Lulus</div>
            <div class="stat-value" id="totalCourses">0</div>
            <div class="stat-sub">matakuliah</div>
          </div>
        </div>

        <!-- Daftar nilai -->
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <h2 class="section-title">Daftar Nilai</h2>
          <button class="btn btn-sm btn-outline" onclick="window.print()"><i class="fas fa-print"></i> Cetak KHS</button>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>No</th><th>Kode</th><th>Mata Kuliah</th><th>SKS</th><th>Nilai</th><th>Bobot</th><th>Mutu</th></tr>
              </thead>
              <tbody id="gradesBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const user = checkSession();
    if (user) {
      buildShell({ active: 'khs', title: 'Hasil Studi' });

      document.getElementById('gpaValue').textContent = calculateGPA();
      document.getElementById('totalCredits').textContent = getTotalPassedCredits();

      const grades = getGrades();
      document.getElementById('totalCourses').textContent = grades.length;
      const body = document.getElementById('gradesBody');

      if (grades.length === 0) {
        body.innerHTML = '<tr><td colspan="7" class="text-center" style="color:var(--muted)">Belum ada data nilai</td></tr>';
      } else {
        let totalWeighted = 0, totalSks = 0;
        body.innerHTML = grades.map((g, i) => {
          const mutu = g.weight * g.sks;
          totalWeighted += mutu; totalSks += g.sks;
          return `
            <tr>
              <td class="text-center">${i + 1}</td>
              <td>${g.code}</td><td>${g.name}</td>
              <td class="text-center">${g.sks}</td>
              <td class="text-center"><strong>${g.grade}</strong></td>
              <td class="text-center">${g.weight.toFixed(1)}</td>
              <td class="text-center">${mutu.toFixed(1)}</td>
            </tr>`;
        }).join('');
        body.innerHTML += `
          <tr style="font-weight:700;background:#FAFAF9;">
            <td colspan="3" class="text-right">TOTAL</td>
            <td class="text-center">${totalSks}</td>
            <td colspan="2"></td>
            <td class="text-center">${totalWeighted.toFixed(1)}</td>
          </tr>
          <tr style="font-weight:700;background:var(--sky-soft);color:var(--blue);">
            <td colspan="6" class="text-right">INDEKS PRESTASI KUMULATIF (IPK)</td>
            <td class="text-center">${calculateGPA()}</td>
          </tr>`;
      }
    }
  </script>
</body>
</html>
