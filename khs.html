<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Studi - Portal Administratif Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/khs.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Content Area -->
  <main class="content-area">
    <div class="khs-top-action-bar">
      <h2 class="dashboard-title">Kartu Hasil Studi (KHS)</h2>
      <button class="btn-print-khs" onclick="window.print()">
        <i class="fas fa-print"></i> Cetak KHS
      </button>
    </div>

    <div class="dashboard-grid khs-grid-modifier">
      
      <div class="grid-left-side">
        <div class="table-card">
          <h3 class="table-card-title"><i class="fas fa-list-ol" style="color: var(--color-blue-primary);"></i> Rincian Nilai Akademik</h3>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th width="5%" class="text-center">No</th>
                  <th width="15%">Kode MK</th>
                  <th>Nama Mata Kuliah</th>
                  <th width="12%" class="text-center">SKS</th>
                  <th width="15%" class="text-center">Nilai Huruf</th>
                  <th width="12%" class="text-center">Bobot</th>
                  <th width="15%" class="text-center">Nilai &times; Bobot</th>
                </tr>
              </thead>
              <tbody id="gradesBody">
                <!-- Will be dynamically loaded -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="side-card layout-gpa-widget table-card">
        <div class="gpa-badge-container">
          <div class="gpa-icon-wrapper">
            <i class="fas fa-award"></i>
          </div>
          <h4>Indeks Prestasi Kumulatif</h4>
          <div class="gpa-value-modern" id="gpaValue">0.00</div>
        </div>
        
        <div class="gpa-widget-footer">
          <div class="gpa-footer-item">
            <span class="gpa-footer-label">Total SKS Lulus</span>
            <span class="gpa-footer-value" id="totalCredits">0 SKS</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    checkSession();
    // Load KHS data
    const user = getCurrentUser();
    if (user) {
      document.getElementById('gpaValue').textContent = calculateGPA();
      document.getElementById('totalCredits').textContent = getTotalPassedCredits() + ' SKS';
      
      // Load grades table for the latest semester only
      const allGrades = getGrades();
      const latestSemester = '2025-2026/2';
      const grades = allGrades.filter(g => g.tahun === latestSemester);
      
      const gradesBody = document.getElementById('gradesBody');
      
      if (grades.length === 0) {
        gradesBody.innerHTML = '<tr><td colspan="7" class="text-center">Belum ada data nilai semester ini</td></tr>';
      } else {
        gradesBody.innerHTML = '';
        let totalWeighted = 0;
        let totalSks = 0;
        
        grades.forEach((grade, index) => {
          const weightedScore = grade.weight * grade.sks;
          totalWeighted += weightedScore;
          totalSks += grade.sks;
          
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="text-center">${index + 1}</td>
            <td><strong>${grade.code}</strong></td>
            <td>${grade.name}</td>
            <td class="text-center font-semibold">${grade.sks}</td>
            <td class="text-center"><span class="grade-letter-badge">${grade.grade}</span></td>
            <td class="text-center">${grade.weight.toFixed(2)}</td>
            <td class="text-center font-semibold">${weightedScore.toFixed(1)}</td>
          `;
          gradesBody.appendChild(row);
        });
        
        const ips = totalSks > 0 ? (totalWeighted / totalSks).toFixed(2) : 0;
        
        // Add summary row
        const summaryRow = document.createElement('tr');
        summaryRow.className = "table-row-summary";
        summaryRow.innerHTML = `
          <td colspan="3" class="text-right">TOTAL BEBAN STUDI SEMESTER INI</td>
          <td class="text-center font-semibold">${totalSks}</td>
          <td colspan="2"></td>
          <td class="text-center font-semibold">${totalWeighted.toFixed(1)}</td>
        `;
        gradesBody.appendChild(summaryRow);
        
        // Add IPS row
        const ipsRow = document.createElement('tr');
        ipsRow.className = "table-row-gpa-summary";
        ipsRow.innerHTML = `
          <td colspan="3" class="text-right">INDEKS PRESTASI SEMESTER (IPS)</td>
          <td colspan="4" class="text-center summary-gpa-highlight">${ips}</td>
        `;
        gradesBody.appendChild(ipsRow);
      }
    }
  </script>
</body>
</html>
