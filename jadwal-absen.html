<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Kuliah - Portal Administrasi Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar" id="topbar"></div>
      <div class="content">

        <h2 class="section-title first">Jadwal Kuliah Semester Ini</h2>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>No</th><th>Hari</th><th>Jam</th><th>Kode</th><th>Mata Kuliah</th><th>SKS</th><th>Ruang</th><th>Dosen</th><th>Aksi</th></tr>
              </thead>
              <tbody id="scheduleBody"></tbody>
            </table>
          </div>
        </div>

        <h2 class="section-title">Riwayat Absensi</h2>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>No</th><th>Tanggal</th><th>Kode</th><th>Mata Kuliah</th><th>Status</th></tr>
              </thead>
              <tbody id="attendanceBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const user = checkSession();
    if (user) {
      buildShell({ active: 'jadwal', title: 'Jadwal Kuliah' });

      const krs = getKRS();
      const scheduleBody = document.getElementById('scheduleBody');
      if (krs.length === 0) {
        scheduleBody.innerHTML = '<tr><td colspan="9" class="text-center" style="color:var(--muted)">Belum ada mata kuliah yang diambil</td></tr>';
      } else {
        const dayOrder = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
        krs.sort((a, b) => dayOrder.indexOf(a.day) - dayOrder.indexOf(b.day));
        scheduleBody.innerHTML = krs.map((c, i) => `
          <tr>
            <td class="text-center">${i + 1}</td>
            <td>${c.day}</td><td>${c.time}</td><td>${c.code}</td><td>${c.name}</td>
            <td class="text-center">${c.sks}</td><td>${c.room}</td><td>${c.lecturer}</td>
            <td class="text-center"><button class="btn btn-sm btn-ghost" onclick="attendClass('${c.code}')"><i class="fas fa-check"></i> Absen</button></td>
          </tr>`).join('');
      }

      loadAttendanceHistory();
    }

    function attendClass(code) {
      const r = doAbsen(code);
      alert(r.message);
      if (r.success) loadAttendanceHistory();
    }

    function loadAttendanceHistory() {
      const logs = getAttendanceLog();
      const body = document.getElementById('attendanceBody');
      if (logs.length === 0) {
        body.innerHTML = '<tr><td colspan="5" class="text-center" style="color:var(--muted)">Belum ada riwayat absensi</td></tr>';
        return;
      }
      const sorted = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date));
      body.innerHTML = sorted.map((log, i) => {
        const course = getCourseByCode(log.courseCode);
        return `
          <tr>
            <td class="text-center">${i + 1}</td>
            <td>${formatDate(log.date)}</td>
            <td>${log.courseCode}</td>
            <td>${course ? course.name : '-'}</td>
            <td class="text-center"><span class="badge success"><i class="fas fa-circle-check"></i> ${log.status}</span></td>
          </tr>`;
      }).join('');
    }
  </script>
</body>
</html>
