<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Administratif Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Connect to Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">
<div class="grid min-h-screen grid-cols-1 lg:grid-cols-2">
  <!-- Left Side: Login Form -->
  <div class="flex flex-col justify-center px-6 py-12 sm:px-12 lg:px-20 xl:px-24">
    <div class="mx-auto w-full max-w-sm">
      <div class="text-center">
        <h2 class="mt-10 text-3xl font-bold tracking-tight text-Black">Login</h2>
        <h3 class="mt-1 text-lg text-Gray">masuk ke portal administrasi akademik</h3>
      </div>

      <div class="mt-10">
        <form id="loginForm" action="#" method="POST" class="space-y-6">
          <div>
            <label for="nim" class="block text-base font-medium text-Black">NIM</label>
            <div class="mt-2">
              <input id="nim" type="text" name="nim" required placeholder="Masukkan NIM" class="block w-full rounded-md bg-white px-4 py-2 text-lg text-gray-900 border border-gray-300 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between">
              <label for="password" class="block text-base font-medium text-Black">Password</label>
            </div>
            <div class="mt-2">
              <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Masukkan Password" class="block w-full rounded-md bg-white px-4 py-2 text-lg text-gray-900 border border-gray-300 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500" />
            </div>
          </div>

          <div>
            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-md bg-black px-4 py-2 text-lg font-semibold text-white hover:bg-gray-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black">
              <i class="bi bi-box-arrow-in-right text-[#2C79DE]"></i> Login
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Right Side: Branding image (Figma Group 18) -->
  <div class="hidden lg:flex items-center justify-center p-6">
    <img src="img/Group 18.jpg" alt="Portal Administrasi Mahasiswa"
         class="w-[80%] h-auto rounded-2xl object-contain" />
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  // Check if already logged in
  checkSession();

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const nim = document.getElementById('nim').value;
    const password = document.getElementById('password').value;

    if (login(nim, password)) {
      window.location.href = 'index.html';
    } else {
      alert('NIM atau Password salah!');
    }
  });
</script>
</body>
</html>
