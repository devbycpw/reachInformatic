<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Administrasi Mahasiswa</title>

    <link rel="stylesheet" href="assets/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="login-body">

<div class="login-container">

    <!-- Left Side -->
    <div class="login-side">

        <div class="login-card">

            <div class="header">
                <h1>Login</h1>
                <p>Masuk ke portal administrasi akademik</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input
                        type="text"
                        id="nim"
                        name="nim"
                        placeholder="Masukkan NIM"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan Password"
                        required>
                </div>

                <button type="submit" class="login-btn">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Login
                </button>

            </form>

        </div>

    </div>

    <!-- Right Side -->
    <div class="image-side">
        <img
            src="img/Group 18.jpg"
            alt="Portal Administrasi Mahasiswa">
    </div>

</div>

<script src="assets/app.js"></script>
<script>
    // Check if already logged in (redirects if active)
    checkSession();
    
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nim = document.getElementById('nim').value;
      const password = document.getElementById('password').value;
      
      if (login(nim, password)) {
        window.location.href = 'index.html';
      } else {
        alert('NIM atau Password salah! (Demo: NIM: 11223344 | Password: rahasia123)');
      }
    });
</script>

</body>
</html>
