<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Administratif Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Connect to Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900">
<div class="grid min-h-screen grid-cols-1 lg:grid-cols-2">
  <!-- Left Side: Login Form -->
  <div class="flex flex-col justify-center px-6 py-12 sm:px-12 lg:px-20 xl:px-24">
    <div class="mx-auto w-full max-w-sm">
      <div>
        <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="Your Company" class="h-10 w-auto" />

        <h2 class="mt-10 text-2xl/9 font-bold tracking-tight text-white">Login</h2>
        <h3 class="text-gray-400">masuk ke portal administrasi akademik</h3>
      </div>

      <div class="mt-10">
        <form id="loginForm" action="#" method="POST" class="space-y-6">
          <div>
            <label for="nim" class="block text-sm/6 font-medium text-gray-100">NIM</label>
            <div class="mt-2">
              <input id="nim" type="text" name="nim" required class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between">
              <label for="password" class="block text-sm/6 font-medium text-gray-100">Password</label>
              <div class="text-sm">
                <a href="#" class="font-semibold text-indigo-400 hover:text-indigo-300">Forgot password?</a>
              </div>
            </div>
            <div class="mt-2">
              <input id="password" type="password" name="password" required autocomplete="current-password" class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
            </div>
          </div>

          <div>
            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-md bg-black px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-gray-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
          </div>
        </form>

        <p class="mt-10 text-center text-sm/6 text-gray-400">
          Not a member?
          <a href="#" class="font-semibold text-indigo-400 hover:text-indigo-300">Start a 14 day free trial</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side: Branding image (Figma Group 18) -->
  <div class="hidden lg:flex items-center justify-center p-6">
    <img src="img/Group 18.jpg" alt="Portal Administrasi Mahasiswa"
         class="h-[85%] w-[85%] rounded-2xl object-cover" />
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  // Check if already logged in
  checkSession();

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const nim = document.getElementById('nim').value;
    const password = document.getElementById('password').value;

    if (login(nim, password)) {
      window.location.href = 'index.html';
    } else {
      alert('NIM atau Password salah!');
    }
  });
</script>
</body>
</html>
