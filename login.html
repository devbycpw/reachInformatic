<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Administrasi Mahasiswa</title>

    <link rel="stylesheet" href="assets/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="login-body">

<div class="login-container">

    <div class="login-side">

        <div class="login-card">

            <div class="header">
                <h1>Login</h1>
                <p>Masuk ke portal administrasi akademik</p>
            </div>

            <form id="loginForm">

                <div id="formInputs">
                    <div class="form-group">
                        <label for="nim">NIM</label>
                        <input
                            type="text"
                            id="nim"
                            name="nim"
                            placeholder="123456789"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukan Password Anda"
                            required>
                    </div>

                    <div id="loginAlert" class="login-alert" style="display: none;"></div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <i class="bi bi-box-arrow-in-right fa-xl"></i>
                        <span id="loginBtnText">Login</span>
                    </button>
                </div>

                <div id="coolLoading" class="cool-loading" style="display: none;">
                    <div class="spinner-container" id="spinnerContainer">
                        <div class="cool-spinner"></div>
                    </div>
                    <div class="success-container" id="successContainer" style="display: none;">
                        <div class="success-checkmark"><i class="fas fa-check"></i></div>
                    </div>
                    <p id="coolLoadingText">Memverifikasi Data...</p>
                </div>

            </form>

        </div>

    </div>

    <div class="image-side">
        <img
            src="img/Group 18.jpg"
            alt="Portal Administrasi Mahasiswa">
    </div>

</div>

<script src="assets/app.js"></script>
<script>
    checkSession();
    
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nim = document.getElementById('nim').value;
      const password = document.getElementById('password').value;
      
      const formInputs = document.getElementById('formInputs');
      const coolLoading = document.getElementById('coolLoading');
      const spinnerContainer = document.getElementById('spinnerContainer');
      const successContainer = document.getElementById('successContainer');
      const coolLoadingText = document.getElementById('coolLoadingText');
      const alertBox = document.getElementById('loginAlert');
      
      alertBox.style.display = 'none';
      alertBox.className = 'login-alert';
      
      // Sembunyikan field, tampilkan animasi loading
      formInputs.style.display = 'none';
      coolLoading.style.display = 'flex';
      spinnerContainer.style.display = 'flex';
      successContainer.style.display = 'none';
      coolLoadingText.textContent = 'Memverifikasi Data...';
      coolLoadingText.style.color = 'var(--color-dark)';
      
      setTimeout(() => {
        if (login(nim, password)) {
          // Animasi sukses
          spinnerContainer.style.display = 'none';
          successContainer.style.display = 'flex';
          coolLoadingText.textContent = 'Login Berhasil!';
          coolLoadingText.style.color = '#10B981';
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          // Kembali ke field jika gagal
          coolLoading.style.display = 'none';
          formInputs.style.display = 'block';
          formInputs.style.animation = 'fadeIn 0.4s ease forwards';
          
          alertBox.style.display = 'flex';
          alertBox.className = 'login-alert error';
          alertBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> NIM atau Password salah! (Demo: NIM: 11223344 | Password: rahasia123)';
        }
      }, 1500); // 1.5 detik loading
    });
</script>

</body>
</html>
