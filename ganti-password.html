<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganti Password - Portal Administratif Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Content Area -->
  <main class="content-area">
    <h2 class="dashboard-title">Ganti Password</h2>
    
    <div class="panel-card" style="max-width: 600px;">
      <div class="panel-header">
        <i class="fas fa-key" style="color: var(--color-blue-primary);"></i>
        <h3>Ubah Password Akun</h3>
      </div>
      
      <form id="passwordForm" class="panel-body">
        <div class="form-group">
          <label for="oldPassword">Password Lama</label>
          <input type="password" id="oldPassword" name="oldPassword" required class="form-control" placeholder="Masukkan password saat ini">
        </div>
        
        <div class="form-group">
          <label for="newPassword">Password Baru</label>
          <input type="password" id="newPassword" name="newPassword" required class="form-control" placeholder="Masukkan password baru">
          <small style="color: var(--color-gray-dark); margin-top: 4px;">Minimal 6 karakter kombinasi huruf dan angka.</small>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password Baru</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required class="form-control" placeholder="Ulangi password baru">
        </div>
        
        <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--color-gray-light); padding-top: 20px; margin-top: 24px;">
          <button type="button" onclick="location.href='index.html'" class="btn btn-secondary">Batal</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Perbarui Password
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const user = getCurrentUser();
    
    document.getElementById('passwordForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (newPassword !== confirmPassword) {
        alert('Konfirmasi password baru tidak cocok!');
        return;
      }
      
      if (newPassword.length < 6) {
        alert('Password baru minimal harus 6 karakter!');
        return;
      }
      
      // Fetch users from localStorage
      const users = JSON.parse(localStorage.getItem('mock_users') || '[]');
      const userIndex = users.findIndex(u => u.nim === user.nim);
      
      if (userIndex === -1) {
        alert('User tidak ditemukan dalam sesi!');
        return;
      }
      
      // Validate old password
      if (users[userIndex].password !== oldPassword) {
        alert('Password lama Anda salah!');
        return;
      }
      
      // Update password
      users[userIndex].password = newPassword;
      localStorage.setItem('mock_users', JSON.stringify(users));
      
      alert('Password berhasil diperbarui! Silakan login kembali dengan password baru Anda.');
      logout();
    });
  </script>
</body>
</html>
