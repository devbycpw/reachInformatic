<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganti Password - Portal Administratif Mahasiswa</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/ganti-password.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body>

  <div class="main-container">

    <aside class="sidebar" id="sidebar-app"></aside>

    <main class="content-area">
      <div class="page-header">
        <h2 class="dashboard-title">Ganti Password</h2>
      </div>

      <div class="pw-wrap">
        <div class="pw-card">
          <div class="pw-card-header">
            <i class="ph ph-shield-check"></i>
            <h3>Perbarui Kata Sandi Akun</h3>
          </div>

          <form class="pw-form" id="passwordForm" autocomplete="off" novalidate>

            <div class="pw-feedback" id="formFeedback"></div>

            <div class="field" id="field-current">
              <label for="currentPassword">Password Saat Ini <span class="req">*</span></label>
              <div class="input-wrap">
                <input type="password" id="currentPassword" autocomplete="current-password" placeholder="Masukkan password lama">
                <button type="button" class="toggle-pass" data-target="currentPassword" aria-label="Tampilkan password">
                  <i class="ph ph-eye"></i>
                </button>
              </div>
              <span class="field-error"><i class="ph ph-warning-circle"></i> <span class="msg"></span></span>
            </div>

            <div class="field" id="field-new">
              <label for="newPassword">Password Baru <span class="req">*</span></label>
              <div class="input-wrap">
                <input type="password" id="newPassword" autocomplete="new-password" placeholder="Minimal 6 karakter">
                <button type="button" class="toggle-pass" data-target="newPassword" aria-label="Tampilkan password">
                  <i class="ph ph-eye"></i>
                </button>
              </div>
              <span class="field-error"><i class="ph ph-warning-circle"></i> <span class="msg"></span></span>
            </div>

            <div class="field" id="field-confirm">
              <label for="confirmPassword">Konfirmasi Password Baru <span class="req">*</span></label>
              <div class="input-wrap">
                <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Ulangi password baru">
                <button type="button" class="toggle-pass" data-target="confirmPassword" aria-label="Tampilkan password">
                  <i class="ph ph-eye"></i>
                </button>
              </div>
              <span class="field-error"><i class="ph ph-warning-circle"></i> <span class="msg"></span></span>
            </div>

            <div class="pw-hint">
              <i class="ph ph-info"></i> Gunakan minimal 6 karakter. Kombinasi huruf besar, huruf kecil, dan angka membuat password lebih aman.
            </div>

            <div class="pw-actions">
              <button type="button" class="btn-ghost" onclick="document.getElementById('passwordForm').reset(); clearErrors();">Reset</button>
              <button type="submit" class="btn-primary"><i class="ph ph-floppy-disk"></i> Simpan Password</button>
            </div>
          </form>
        </div>
      </div>

      <div class="footer">
        <p>&copy; 2026 Portal Administratif Mahasiswa &middot; Jaga kerahasiaan password Anda.</p>
      </div>
    </main>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const user = checkSession();
    renderReusableSidebar();

    function setError(fieldId, message) {
      const field = document.getElementById(fieldId);
      field.classList.add('invalid');
      field.querySelector('.msg').textContent = message;
    }

    function clearErrors() {
      document.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));
      const fb = document.getElementById('formFeedback');
      fb.className = 'pw-feedback';
      fb.textContent = '';
    }

    function showFeedback(type, message) {
      const fb = document.getElementById('formFeedback');
      fb.className = 'pw-feedback show ' + (type === 'ok' ? 'ok' : 'err');
      fb.innerHTML = `<i class="ph ${type === 'ok' ? 'ph-check-circle' : 'ph-x-circle'}"></i> ${message}`;
    }

    // Show/hide password toggles
    document.querySelectorAll('.toggle-pass').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const icon = btn.querySelector('i');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        icon.classList.toggle('ph-eye', !show);
        icon.classList.toggle('ph-eye-slash', show);
      });
    });

    document.getElementById('passwordForm').addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors();

      const current = document.getElementById('currentPassword').value;
      const next = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      let valid = true;
      if (!current) { setError('field-current', 'Password saat ini wajib diisi.'); valid = false; }
      if (!next) { setError('field-new', 'Password baru wajib diisi.'); valid = false; }
      else if (next.length < 6) { setError('field-new', 'Password baru minimal 6 karakter.'); valid = false; }
      if (confirm !== next) { setError('field-confirm', 'Konfirmasi password tidak cocok.'); valid = false; }
      if (!valid) return;

      const result = changePassword(current, next);
      if (result.success) {
        showFeedback('ok', result.message);
        this.reset();
      } else {
        // Surface the error on the most relevant field where possible
        if (/saat ini/i.test(result.message)) setError('field-current', result.message);
        else if (/baru/i.test(result.message)) setError('field-new', result.message);
        showFeedback('err', result.message);
      }
    });
  </script>
</body>
</html>
